<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Endstone Paradox AntiCheat</title>
  <desc id="description">Paradox AntiCheat - A comprehensive anti-cheat system for Endstone Bedrock servers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141a"/>
      <stop offset="0.52" stop-color="#102b39"/>
      <stop offset="1" stop-color="#1c1738"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52e5d1"/>
      <stop offset="0.5" stop-color="#63b8ff"/>
      <stop offset="1" stop-color="#f2b84b"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52e5d1" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#52e5d1"/>
      <stop offset="0.75" stop-color="#f2b84b"/>
      <stop offset="1" stop-color="#f2b84b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9cdceb" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#background)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <circle cx="1120" cy="-20" r="220" fill="#63b8ff" opacity="0.07"/>
  <circle cx="60" cy="360" r="190" fill="#52e5d1" opacity="0.07"/>

  <g transform="translate(72 48)">
    <path d="M112 4 210 60v116l-98 56-98-56V60Z" fill="#0b1b25" stroke="url(#accent)" stroke-width="3"/>
    <path d="m112 28 75 43-75 43-75-43Z" fill="#18384a" stroke="#63b8ff" stroke-opacity="0.7" stroke-width="2"/>
    <path d="m37 71 75 43v91l-75-42Z" fill="#102b39" stroke="#52e5d1" stroke-opacity="0.65" stroke-width="2"/>
    <path d="m187 71-75 43v91l75-42Z" fill="#17243d" stroke="#f2b84b" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="112" cy="114" r="43" fill="#0b1b25" stroke="url(#accent)" stroke-width="3" filter="url(#glow)"/>
    <text x="112" y="126" text-anchor="middle" fill="#f5fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="760">PA</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="350" y="107" fill="#9fc8d4" font-size="19" font-weight="650" letter-spacing="4">ENDSTONE &#8226; PYTHON PLUGIN</text>
    <text x="346" y="168" fill="#f5fbff" font-size="52" font-weight="760" letter-spacing="-1.3">Paradox AntiCheat</text>
    <text x="350" y="210" fill="#c0d4df" font-size="19">Paradox AntiCheat - A comprehensive anti-cheat system for Endstone Bedrock servers</text>
    <g transform="translate(350 247)" font-size="15" font-weight="650">
      <rect width="174" height="36" rx="18" fill="#52e5d1" fill-opacity="0.11" stroke="#52e5d1" stroke-opacity="0.44"/>
      <text x="87" y="23" text-anchor="middle" fill="#82efe0">Endstone 0.11.8</text>
      <rect x="188" width="154" height="36" rx="18" fill="#63b8ff" fill-opacity="0.11" stroke="#63b8ff" stroke-opacity="0.44"/>
      <text x="265" y="23" text-anchor="middle" fill="#9bd0ff">BDS 1.26.40</text>
      <rect x="356" width="132" height="36" rx="18" fill="#f2b84b" fill-opacity="0.1" stroke="#f2b84b" stroke-opacity="0.42"/>
      <text x="422" y="23" text-anchor="middle" fill="#ffd27a">v1.9.2</text>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="337" rx="22.5" fill="none" stroke="url(#rule)" stroke-width="3" opacity="0.72"/>
</svg>
